<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080a0d" />
  <meta name="color-scheme" content="dark" />
  <title>Sistema de Fechaduras</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    window.addEventListener("error", function () {
      var root = document.getElementById("app");
      if (root && root.querySelector(".boot-state")) root.textContent = "Falha ao carregar a interface. Reabra a extensão.";
    });
    window.addEventListener("unhandledrejection", function () {
      var root = document.getElementById("app");
      if (root && root.querySelector(".boot-state")) root.textContent = "Falha ao iniciar o Owlbear SDK. Atualize a extensão.";
    });
  </script>
</head>
<body>
  <main id="app" class="app" aria-live="polite"><div class="boot-state">CARREGANDO INTERFACE...</div></main>
  <noscript>Esta extensão precisa de JavaScript habilitado.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
